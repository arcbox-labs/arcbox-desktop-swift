name: PR Check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      # The action installs with `--profile minimal`, so clippy and rustfmt
      # have to be asked for by name — `make lint-xtask` needs both.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
          components: clippy, rustfmt

      # Ahead of the caches below: both key on the toolchain, because Swift
      # build products are not portable across Xcode versions.
      - name: Record build environment
        id: build_environment
        run: |
          XCODE_CACHE_KEY=$(xcodebuild -version | awk 'NR == 1 { version = $2 } NR == 2 { build = $3 } END { print version "-" build }')
          echo "xcode_cache_key=$XCODE_CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "=== Build environment ==="
          echo "Runner architecture: $(uname -m)"
          echo "CPU: $(sysctl -n machdep.cpu.brand_string)"
          echo "Logical CPUs: $(sysctl -n hw.logicalcpu)"
          echo "Memory: $(sysctl -n hw.memsize) bytes"
          xcodebuild -version
          swiftc --version
          df -h "$GITHUB_WORKSPACE"

      - name: Restore desktop Rust tooling cache
        id: desktop_rust_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            xtask/target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-xtask-${{ hashFiles('xtask/Cargo.lock') }}-${{ hashFiles('xtask/Cargo.toml', 'xtask/src/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-xtask-${{ hashFiles('xtask/Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-xtask-

      # generate.sh builds protoc-gen-swift and protoc-gen-grpc-swift from
      # Packages/ArcBoxClient, so this scratch path holds their SwiftPM
      # checkouts as well as the built plugins. Caching it keeps a step that
      # only regenerates protobuf off the network. No restore-keys: a partial
      # match would seed the generator with plugins built from a different
      # resolution, and the generated code has to match the runtime the app
      # compiles it against.
      - name: Restore protoc plugin cache
        id: protoc_plugin_cache
        uses: actions/cache/restore@v6
        with:
          path: .build/protoc-plugins/
          key: ${{ runner.os }}-${{ runner.arch }}-protoc-plugins-${{ steps.build_environment.outputs.xcode_cache_key }}-${{ hashFiles('Packages/ArcBoxClient/Package.resolved', 'Packages/ArcBoxClient/Package.swift', 'Packages/ArcBoxClient/generate.sh') }}

      - name: Verify protobuf generated code is up-to-date
        run: |
          brew install protobuf
          make verify-arcbox-protobuf

      # `protocol verify` above only compiles xtask; nothing ran its tests.
      - name: Lint and test xtask
        run: make lint-xtask test-xtask

      # Release DMG extracts the same section to feed Sparkle's update dialog,
      # and refuses to build without it. Running it here fails the release PR
      # while a missing `### Highlights` is still an edit away from fixed —
      # once that PR merges, the tag and the draft release already exist.
      # On every other PR the manifest names the last shipped version, so this
      # only re-checks an entry that is already curated.
      - name: Verify curated release highlights
        run: |
          cargo xtask release notes \
            --version "$(jq -r '."."' .release-please-manifest.json)" \
            --output "$RUNNER_TEMP/release-notes.md"

      # `make lint` is what a contributor runs, and scripts/tool.sh holds the
      # version floors, so the two cannot drift apart.
      - name: Lint
        run: |
          brew install swift-format swiftlint
          make lint

      - name: Create local Xcode config
        run: |
          cat > Local.xcconfig <<'XCEOF'
          #include "Version.xcconfig"
          DEVELOPMENT_TEAM = 422ACSY6Y5
          SENTRY_DSN =
          POSTHOG_API_KEY =
          OIDC_ISSUER_URL =
          OIDC_CLIENT_ID =
          XCEOF

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          make generate-xcodeproj
          git diff --exit-code ArcBox.xcodeproj ArcBox/Info.plist project.yml

      - name: Restore Swift package cache
        id: swift_packages_cache
        uses: actions/cache/restore@v6
        with:
          path: .build/SourcePackages/
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ hashFiles('ArcBox.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/**/Package.resolved', 'Packages/**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-

      - name: Restore Xcode build cache
        id: xcode_build_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/DerivedData/Build/
            .build/DerivedData/ModuleCache.noindex/
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.build_environment.outputs.xcode_cache_key }}-swift-${{ hashFiles('ArcBox.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/**/Package.resolved', 'Packages/**/Package.swift') }}-${{ hashFiles('ArcBox.xcodeproj/project.pbxproj') }}-${{ hashFiles('ArcBox/**', 'ArcBoxTests/**', 'Packages/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.build_environment.outputs.xcode_cache_key }}-swift-${{ hashFiles('ArcBox.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/**/Package.resolved', 'Packages/**/Package.swift') }}-${{ hashFiles('ArcBox.xcodeproj/project.pbxproj') }}-
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.build_environment.outputs.xcode_cache_key }}-swift-${{ hashFiles('ArcBox.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/**/Package.resolved', 'Packages/**/Package.swift') }}-

      # `-onlyUsePackageVersionsFromResolvedFile` is what makes this a gate
      # rather than a cache warm-up: without it this step would quietly repair a
      # stale Package.resolved, and the build that follows would never see the
      # drift. A PR that edits a Package.swift must commit the lockfile too.
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ArcBox.xcodeproj \
            -scheme ArcBox \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile

      # `shell: bash` is load-bearing on every step that pipes into xcpretty:
      # the default shell is `bash -e`, whose pipeline status comes from
      # xcpretty, so a failing xcodebuild reported success. `shell: bash` runs
      # with `-eo pipefail`. Build and test go through the Makefile so a
      # contributor's `make test` runs exactly what CI runs.
      - name: Build (Debug)
        shell: bash
        run: make build XCODEBUILD_EXTRA=-showBuildTimingSummary | xcpretty --color

      - name: Run Tests
        shell: bash
        run: make test XCODEBUILD_EXTRA=-showBuildTimingSummary | xcpretty --color

      - name: Warm Release cache (ARM64)
        if: github.event_name == 'push'
        shell: bash
        run: |
          make build \
            CONFIGURATION=Release \
            DESTINATION='platform=macOS,arch=arm64' \
            ARCHS=arm64 \
            XCODEBUILD_EXTRA=-showBuildTimingSummary

      - name: Save protoc plugin cache
        if: github.event_name == 'push' && steps.protoc_plugin_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/protoc-plugins/
          key: ${{ steps.protoc_plugin_cache.outputs.cache-primary-key }}

      - name: Save desktop Rust tooling cache
        if: github.event_name == 'push' && steps.desktop_rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            xtask/target/
          key: ${{ steps.desktop_rust_cache.outputs.cache-primary-key }}

      - name: Save Swift package cache
        if: github.event_name == 'push' && steps.swift_packages_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/SourcePackages/
          key: ${{ steps.swift_packages_cache.outputs.cache-primary-key }}

      - name: Save Xcode build cache
        if: github.event_name == 'push' && steps.xcode_build_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .build/DerivedData/Build/
            .build/DerivedData/ModuleCache.noindex/
          key: ${{ steps.xcode_build_cache.outputs.cache-primary-key }}
